name: tests-services

on:
  push:
    branches:
      - chore/testing
  pull_request:
    branches:
      - chore/testing

jobs:
  test-services:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm test:services
