  mongodb:
    image: mongo:7.0
    container_name: mongodb-prod
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=${DB_NAME:-procrastinator}
    volumes:
      - mongodb_data:/data/db
      - ./infra/mongo/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - internal
    restart: unless-stopped
    # Pas d'exposition directe en prod - accès uniquement via réseau interne

volumes:
  mongodb_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  web:
    driver: bridge
  internal:
    driver: bridge