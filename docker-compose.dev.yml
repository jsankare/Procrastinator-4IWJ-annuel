#docker-copmpose.dev.yml
services:
  # Reverse Proxy : Traefik
  traefik:
    image: traefik:latest
    container_name: traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--log.level=INFO"
    ports:
      - "80:80" #HTTP
      - "8080:8080" #Dashboard traefik
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    networks:
      - task-manager-network
    restart: unless-stopped

  # Frontend : Nuxt v4
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: task-manager-frontend
    environment:
      - NODE_ENV=development
      - NUXT_HOST=0.0.0.0
      - NUXT_PORT=3000
    # Pour production, utiliser un fichier .env :
    # env_file:
    #   - ./frontend/.env
    volumes:
      - ./frontend/app:/app/app
      - ./frontend/server:/app/server
      - /app/node_modules
      - /app/.nuxt
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`localhost`) && !PathPrefix(`/api`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
      # Route API requests to Nuxt too (for Nitro server /api/*), while letting dedicated services (e.g. /api/auth) handle their own paths
      - "traefik.http.routers.frontend-api.rule=Host(`localhost`) && PathPrefix(`/api`) && !PathPrefix(`/api/auth`)"
      - "traefik.http.routers.frontend-api.entrypoints=web"
    networks:
      - task-manager-network
    restart: unless-stopped

  # Service d'authentification
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    environment:
      - NODE_ENV=development
      - PORT=3001
      - SERVICE_NAME=auth-service
      - CORS_ORIGIN=http://localhost
    # Pour production, décommenter et utiliser un fichier .env :
    # env_file:
    #   - ./services/auth-service/.env
    volumes:
      - ./services/auth-service:/app
      - /app/node_modules
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=Host(`localhost`) && PathPrefix(`/api/auth`)"
      - "traefik.http.routers.auth.entrypoints=web"
      - "traefik.http.routers.auth.middlewares=auth-stripprefix"
      - "traefik.http.middlewares.auth-stripprefix.stripprefix.prefixes=/api/auth"
      - "traefik.http.services.auth.loadbalancer.server.port=3001"
    networks:
      - task-manager-network
    restart: unless-stopped

