#docker-copmpose.dev.yml
services:
    # Reverse Proxy : Caddy
    caddy:
        image: caddy:2.11
        container_name: caddy
        ports:
            - "80:80"
            - "443:443"
            - "2019:2019" # Admin API
        volumes:
            - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile
            - caddy_data:/data
            - caddy_config:/config
        networks:
            - task-manager-network
        restart: unless-stopped

    mongodb:
        image: mongo:latest
        container_name: task-manager-mongodb
        environment:
            - MONGO_INITDB_ROOT_USERNAME=admin
            - MONGO_INITDB_ROOT_PASSWORD=password123
            - MONGO_INITDB_DATABASE=procrastinator
        ports:
            - "27017:27017"
        volumes:
            - mongodb_data:/data/db
            - ./infra/mongo/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
        networks:
            - task-manager-network
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
            interval: 10s
            timeout: 5s
            retries: 5

    # Frontend : Nuxt v4
    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
        container_name: task-manager-frontend
        # Ports commented out to force usage of Caddy on port 80
        # Uncomment for direct access during debugging if needed
        # ports:
        #     - "3000:3000"
        #     - "3333:3000"
        #     - "5173:5173"
        environment:
            - NODE_ENV=development
            - NUXT_HOST=0.0.0.0
            - NUXT_PORT=3000
            - NUXT_PUBLIC_API_BASE_URL=http://localhost
        # Pour production, utiliser un fichier .env :
        # env_file:
        #   - ./frontend/.env
        volumes:
            - ./frontend/app:/app/app
            - ./frontend/server:/app/server
            - /app/node_modules
            - /app/.nuxt
        # No labels needed for Caddy - configured in Caddyfile
        depends_on:
            mongodb:
                condition: service_healthy
        networks:
            - task-manager-network
        restart: unless-stopped

    # Service d'authentification
    auth-service:
        build:
            context: ./services/auth-service
            dockerfile: Dockerfile
        container_name: auth-service
        environment:
            - NODE_ENV=${NODE_ENV:-development}
            - PORT=3001
            - SERVICE_NAME=auth-service
            - CORS_ORIGIN=http://localhost
            - MONGODB_URI=mongodb://procrastinator_user:procrastinator_pass@mongodb:27017/procrastinator?authSource=procrastinator
            - DB_NAME=procrastinator
            - JWT_SECRET=your-super-secret-jwt-key-change-in-production-please
            - JWT_EXPIRES_IN=7d
            - JWT_REFRESH_EXPIRES_IN=30d
        # Pour production, décommenter et utiliser un fichier .env :
        # env_file:
        #   - ./services/auth-service/.env
        volumes:
            - ./services/auth-service:/app
            - /app/node_modules
        depends_on:
            mongodb:
                condition: service_healthy
        # No labels needed for Caddy - configured in Caddyfile
        networks:
            - task-manager-network
        restart: unless-stopped

    # Service de gestion des workspaces
    workspace-service:
        build:
            context: ./services/workspace-service
            dockerfile: Dockerfile
        container_name: workspace-service
        environment:
            - NODE_ENV=development
            - PORT=3002
            - SERVICE_NAME=workspace-service
            - CORS_ORIGIN=http://localhost
            - MONGODB_URI=mongodb://procrastinator_user:procrastinator_pass@mongodb:27017/procrastinator?authSource=procrastinator
            - DB_NAME=procrastinator
            - JWT_SECRET=your-super-secret-jwt-key-change-in-production-please
            - FRONTEND_URL=http://localhost
        # Pour production, décommenter et utiliser un fichier .env :
        # env_file:
        #   - ./services/workspace-service/.env
        volumes:
            - ./services/workspace-service:/app
            - /app/node_modules
        depends_on:
            mongodb:
                condition: service_healthy
        # No labels needed for Caddy - configured in Caddyfile
        networks:
            - task-manager-network
        restart: unless-stopped

